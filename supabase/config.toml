# Configuración de Supabase versionada en git.
# `supabase config push` solo sube lo que este archivo declara; lo que no
# aparece aquí queda igual en el proyecto. Revisar antes con `supabase config diff`.
project_id = "solarix"

# Correos con código de 6 dígitos ({{ .Token }}) en lugar de enlace: la app
# pide escribir el código para confirmar la cuenta y para recuperar la contraseña.
[auth.email.template.confirmation]
subject = "Tu código de Solarix"
content_path = "./supabase/templates/confirmacion.html"

[auth.email.template.recovery]
subject = "Recupera tu contraseña de Solarix"
content_path = "./supabase/templates/recuperacion.html"

# Límites de Auth (Etapa 12, seguridad del backend), por IP cada 5 minutos.
# El de correos por hora (email_sent) no lo maneja el CLI con SMTP propio: se
# pone en el panel (Authentication > Rate Limits), ver docs/DESPLIEGUE.md.
[auth.rate_limit]
# Inicios de sesión y registros.
sign_in_sign_ups = 15
# Verificación de códigos (confirmar cuenta, recuperar contraseña).
token_verifications = 15
# Renovación de sesión: la app la hace sola, se deja holgada.
token_refresh = 150
